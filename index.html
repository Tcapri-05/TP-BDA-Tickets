<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar | Mesa de Ayuda</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-login">
  <main class="tarjeta-login">
    <div class="logo">MA</div>
    <h1>Mesa de Ayuda</h1>
    <p class="subtitulo">Tablero de tickets de soporte</p>

    <form id="form-login" novalidate>
      <label for="usuario">Usuario</label>
      <input id="usuario" type="text" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <p id="error" class="error" role="alert"></p>

      <button id="btn-ingresar" type="submit">Ingresar</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
